plugins { id 'com.android.application' }
android {
    namespace 'ir.molido.voip'
    compileSdk 35
    defaultConfig { applicationId 'ir.molido.voip'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.1.6' }
    signingConfigs {
        release {
            def ks = System.getenv('MOLIDO_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storeType "PKCS12"
                storePassword System.getenv('MOLIDO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MOLIDO_KEY_ALIAS')
                keyPassword System.getenv('MOLIDO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MOLIDO_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
