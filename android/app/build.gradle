plugins { id 'com.android.application' }
android {
    namespace 'ir.molido.voip'
    compileSdk 35
    defaultConfig { applicationId 'ir.molido.voip'; minSdk 26; targetSdk 35; versionCode 54; versionName '0.5.4' }
    signingConfigs {
        release {
            def ks = System.getenv('MOLIDO_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storeType "PKCS12"
                storePassword System.getenv('MOLIDO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MOLIDO_KEY_ALIAS')
                keyPassword System.getenv('MOLIDO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (System.getenv('MOLIDO_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.linphone:linphone-sdk-android:5.5.15'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
