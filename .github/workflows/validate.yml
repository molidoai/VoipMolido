name: Validate foundation and PWA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/src/index.js && node --check web/app.js && node --check web/sw.js
      - run: cd worker && npm test
      - run: node --test web/test/*.test.js
