name: Android APK build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.MOLIDO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "MOLIDO_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/molido-release.jks"
          echo "MOLIDO_KEYSTORE_PATH=$RUNNER_TEMP/molido-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          MOLIDO_KEYSTORE_PASSWORD: ${{ secrets.MOLIDO_KEYSTORE_PASSWORD }}
          MOLIDO_KEY_ALIAS: ${{ secrets.MOLIDO_KEY_ALIAS }}
          MOLIDO_KEY_PASSWORD: ${{ secrets.MOLIDO_KEY_PASSWORD }}
        run: |
          test -n "$MOLIDO_KEYSTORE_PASSWORD"
          test -n "$MOLIDO_KEY_ALIAS"
          test -n "$MOLIDO_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: molido-voip-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          cp "$APK" "MOLIDO-VOIP-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "MOLIDO-VOIP-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MOLIDO VOIP ${GITHUB_REF_NAME}" \
            --notes "Automatic signed Android release ${GITHUB_REF_NAME}." \
            --verify-tag
