name: Android APK build
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.MOLIDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/molido-release.jks"
            echo "MOLIDO_KEYSTORE_PATH=$RUNNER_TEMP/molido-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build debug and signed release when configured
        working-directory: android
        env:
          MOLIDO_KEYSTORE_PASSWORD: ${{ secrets.MOLIDO_KEYSTORE_PASSWORD }}
          MOLIDO_KEY_ALIAS: ${{ secrets.MOLIDO_KEY_ALIAS }}
          MOLIDO_KEY_PASSWORD: ${{ secrets.MOLIDO_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug --no-daemon
          if [ -n "${MOLIDO_KEYSTORE_PATH:-}" ]; then
            gradle :app:assembleRelease --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: molido-voip-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
